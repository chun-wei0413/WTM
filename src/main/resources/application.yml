spring:
  application:
    name: wtm
  config:
    # Secrets live in .env (git-ignored, created by scripts/init-env.ps1) and are shared
    # with docker-compose. Real environment variables take precedence over the file.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/wtm
    username: ${DB_USERNAME:wtm}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 500MB    # a whole folder of memes can be added in one go

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

wtm:
  data-dir: ${WTM_DATA_DIR:}   # holds the inbox folder; empty means no inbox is watched
  security:
    jwt:
      secret: ${WTM_JWT_SECRET}
      ttl: PT2H
    bootstrap-admin:
      username: ${WTM_ADMIN_USERNAME:admin}
      password: ${WTM_ADMIN_PASSWORD}
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: wtm
  vision:                     # looks at collected pictures and describes them
    provider: mock            # mock | ollama
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5vl:7b
  embedding:
    provider: mock            # mock | ollama
    dimension: 1024           # bge-m3
    ollama:
      base-url: http://localhost:11434
      model: bge-m3
