server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A whole folder of pictures can be uploaded at once (the backend accepts up to 500 MB).
    client_max_body_size 500m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API lives in the backend; the browser only ever talks to this one address.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Files with a hash in their name never change, so they can be kept for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the app; the browser's router decides which one.
    location / {
        try_files $uri /index.html;
    }
}
