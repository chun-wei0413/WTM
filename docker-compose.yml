# Passwords and the data folder come from .env (git-ignored). Create it with: scripts/init-env.ps1
# Everything the site stores (database files, collected pictures) lives under
# WTM_DATA_DIR, so it can sit on a big drive and be backed up as plain folders.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wtm-postgres
    environment:
      POSTGRES_DB: wtm
      POSTGRES_USER: ${DB_USERNAME:-wtm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - run scripts/init-env.ps1}
    ports:
      - "5433:5432"
    volumes:
      - type: bind
        source: ${WTM_DATA_DIR:?WTM_DATA_DIR is not set - run scripts/init-env.ps1}/postgres
        target: /var/lib/postgresql/data

  # S3-compatible object storage. The official minio/minio image is no longer
  # published, so this uses RustFS; the app only speaks the S3 API, so any
  # S3-compatible store can be swapped in here.
  object-storage:
    image: rustfs/rustfs:latest
    container_name: wtm-object-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set - run scripts/init-env.ps1}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set - run scripts/init-env.ps1}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: bind
        source: ${WTM_DATA_DIR:?WTM_DATA_DIR is not set - run scripts/init-env.ps1}/images
        target: /data
