name: CI

# Runs on every push to main and on every pull request, and can be called by the publishing workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The integration tests start real PostgreSQL (pgvector) and an S3-compatible store with Testcontainers;
      # the runner has Docker. The models are mocks, so no graphics card is needed.
      - name: Test and package
        run: mvn -B verify

  web:
    name: Web client checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Only checks that both images can be built; nothing is pushed here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
