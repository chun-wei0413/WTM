name: Publish Docker images

# Publishes the backend and the web client to Docker Hub when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# It needs two secrets in the repository (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   the Docker Hub account
#   DOCKERHUB_TOKEN      an access token created at https://app.docker.com/settings/personal-access-tokens
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is published from a commit that does not pass the same checks as every other commit.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wtm-backend
            context: .
          - image: wtm-web
            context: web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: russellli/${{ matrix.image }}
          # v1.2.3 becomes 1.2.3 and 1.2, and the newest release is also "latest".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
